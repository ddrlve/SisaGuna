<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" role="img" aria-labelledby="t d">
  <title id="t">SisaGuna app preview</title>
  <desc id="d">Three floating phones showing the buyer home screen, a product with a pickup order button, and the partner dashboard with net revenue.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1F2A1C"/>
      <stop offset="1" stop-color="#14200F"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#55B931" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#55B931" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hero-img" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#99D583"/>
      <stop offset="1" stop-color="#55B931"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="0" dy="28" stdDeviation="22" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <clipPath id="clip-screen"><rect x="10" y="10" width="200" height="420" rx="28"/></clipPath>
    <clipPath id="clip-screen-c"><rect x="10" y="10" width="220" height="460" rx="30"/></clipPath>
    <clipPath id="clip-img"><rect x="0" y="0" width="220" height="190"/></clipPath>
  </defs>

  <style>
    text { font-family: 'Plus Jakarta Sans','Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif; }
    .float-a { animation: float 7s ease-in-out infinite; }
    .float-b { animation: float 8s ease-in-out -2.5s infinite; }
    .float-c { animation: float 6.5s ease-in-out -4s infinite; }
    .float-chip { animation: float 5.5s ease-in-out -1s infinite; }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
    @media (prefers-reduced-motion: reduce) { .float-a,.float-b,.float-c,.float-chip { animation: none; } }
  </style>

  <rect width="1200" height="660" rx="32" fill="url(#bg)"/>
  <circle cx="900" cy="330" r="360" fill="url(#glow)"/>
  <circle cx="1130" cy="60" r="140" fill="#55B931" opacity="0.08"/>
  <circle cx="40" cy="640" r="170" fill="#55B931" opacity="0.07"/>

  <!-- Copy -->
  <g>
    <g transform="translate(64 78)">
      <rect width="46" height="46" rx="14" fill="#55B931"/>
      <path d="M23 12c-7 2-11 8-10 15 7 1 13-3 15-10 1-2 0-4-1-5-1 0-3 0-4 0Z" fill="#fff"/>
      <path d="M16 31c4-5 8-9 14-12" stroke="#1F2A1C" stroke-width="2" stroke-linecap="round" fill="none"/>
      <text x="62" y="32" font-size="26" font-weight="800" fill="#fff" letter-spacing="-0.4">SisaGuna</text>
    </g>
    <text x="64" y="236" font-size="60" font-weight="800" fill="#fff" letter-spacing="-1.8">Rescue the food</text>
    <text x="64" y="304" font-size="60" font-weight="800" fill="#99D583" letter-spacing="-1.8">before it's waste.</text>
    <text x="64" y="358" font-size="21" fill="#C9D4C4">Local kitchens post their end-of-day leftovers.</text>
    <text x="64" y="388" font-size="21" fill="#C9D4C4">You pick them up for 50–70% off, or free.</text>

    <g transform="translate(64 442)">
      <rect width="168" height="44" rx="22" fill="#55B931"/>
      <text x="84" y="28.5" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">Up to 70% off</text>
      <rect x="180" width="188" height="44" rx="22" fill="none" stroke="#4A5C45" stroke-width="1.5"/>
      <text x="274" y="28.5" text-anchor="middle" font-size="16" font-weight="600" fill="#E9ECE6">Pickup or courier</text>
      <rect x="380" width="148" height="44" rx="22" fill="none" stroke="#4A5C45" stroke-width="1.5"/>
      <text x="454" y="28.5" text-anchor="middle" font-size="16" font-weight="600" fill="#E9ECE6">Feed &amp; compost</text>
    </g>
    <text x="64" y="568" font-size="15" fill="#8AA183">Android · Kotlin · Jetpack Compose</text>
    <text x="64" y="592" font-size="15" fill="#8AA183">Venture Creation, BINUS University</text>
  </g>

  <!-- Left phone: Home -->
  <g transform="translate(596 176) rotate(-7 110 220) scale(0.94)">
    <g class="float-a">
      <g filter="url(#shadow)">
        <rect width="220" height="440" rx="36" fill="#0C120A"/>
      </g>
      <rect x="4" y="4" width="212" height="432" rx="32" fill="#2A3326"/>
      <g clip-path="url(#clip-screen)">
        <rect x="10" y="10" width="200" height="420" fill="#F6F7F4"/>
        <text x="24" y="52" font-size="9" fill="#6B7466">Deliver to</text>
        <text x="24" y="68" font-size="13" font-weight="700" fill="#1F2A1C">Kemanggisan, Jakarta</text>
        <circle cx="186" cy="58" r="13" fill="#fff"/>
        <path d="M186 51a5 5 0 0 1 5 5v3l2 3h-14l2-3v-3a5 5 0 0 1 5-5Z" fill="#1F2A1C"/>
        <circle cx="191" cy="52" r="3" fill="#DC2626"/>
        <rect x="24" y="84" width="172" height="30" rx="15" fill="#fff" stroke="#E6E8E3"/>
        <circle cx="42" cy="99" r="5" fill="none" stroke="#6B7466" stroke-width="1.6"/>
        <text x="54" y="103" font-size="10" fill="#A3A3A3">Search leftovers nearby</text>
        <rect x="24" y="126" width="172" height="74" rx="16" fill="url(#hero-img)"/>
        <text x="38" y="152" font-size="13" font-weight="800" fill="#fff">Save food,</text>
        <text x="38" y="168" font-size="13" font-weight="800" fill="#fff">save money.</text>
        <circle cx="168" cy="164" r="26" fill="#fff" opacity="0.22"/>
        <circle cx="176" cy="156" r="16" fill="#FDE047"/>
        <text x="24" y="224" font-size="12" font-weight="700" fill="#1F2A1C">Closest to you</text>
        <g transform="translate(24 234)">
          <rect width="172" height="62" rx="14" fill="#fff" stroke="#E6E8E3"/>
          <rect x="8" y="8" width="46" height="46" rx="10" fill="#FFEDD5"/>
          <path d="M16 38c3-12 13-16 22-10 4 3 6 7 6 10-8 4-20 4-28 0Z" fill="#E8A04C"/>
          <text x="64" y="26" font-size="11" font-weight="700" fill="#1F2A1C">Croissant ×4</text>
          <text x="64" y="41" font-size="9" fill="#6B7466">Bakery · 350 m</text>
          <text x="64" y="54" font-size="11" font-weight="800" fill="#408B25">Rp6.000</text>
        </g>
        <g transform="translate(24 304)">
          <rect width="172" height="62" rx="14" fill="#fff" stroke="#E6E8E3"/>
          <rect x="8" y="8" width="46" height="46" rx="10" fill="#DCFCE7"/>
          <circle cx="31" cy="31" r="14" fill="#8AD86C"/>
          <circle cx="26" cy="27" r="4" fill="#FDE047"/>
          <circle cx="36" cy="35" r="4" fill="#fff"/>
          <text x="64" y="26" font-size="11" font-weight="700" fill="#1F2A1C">Gado-gado</text>
          <text x="64" y="41" font-size="9" fill="#6B7466">Warung Bu Sari · 600 m</text>
          <text x="64" y="54" font-size="11" font-weight="800" fill="#408B25">Rp8.000</text>
        </g>
        <rect x="10" y="384" width="200" height="46" fill="#fff"/>
        <line x1="10" y1="384" x2="210" y2="384" stroke="#E6E8E3"/>
        <circle cx="42" cy="406" r="6" fill="#55B931"/>
        <circle cx="90" cy="406" r="6" fill="none" stroke="#A3A3A3" stroke-width="1.6"/>
        <circle cx="138" cy="406" r="6" fill="none" stroke="#A3A3A3" stroke-width="1.6"/>
        <circle cx="186" cy="406" r="6" fill="none" stroke="#A3A3A3" stroke-width="1.6"/>
      </g>
      <rect x="82" y="16" width="56" height="14" rx="7" fill="#0C120A"/>
    </g>
  </g>

  <!-- Right phone: Partner dashboard -->
  <g transform="translate(960 190) rotate(7 110 220) scale(0.92)">
    <g class="float-c">
      <g filter="url(#shadow)">
        <rect width="220" height="440" rx="36" fill="#0C120A"/>
      </g>
      <rect x="4" y="4" width="212" height="432" rx="32" fill="#2A3326"/>
      <g clip-path="url(#clip-screen)">
        <rect x="10" y="10" width="200" height="420" fill="#F6F7F4"/>
        <text x="24" y="52" font-size="9" fill="#6B7466">Partner mode</text>
        <text x="24" y="68" font-size="13" font-weight="700" fill="#1F2A1C">Warung Bu Sari</text>
        <rect x="24" y="84" width="172" height="104" rx="18" fill="#1F2A1C"/>
        <text x="38" y="108" font-size="9" fill="#99D583">Net revenue today</text>
        <text x="38" y="134" font-size="22" font-weight="800" fill="#fff" letter-spacing="-0.5">Rp248.000</text>
        <text x="38" y="150" font-size="8.5" fill="#8AA183">after 10% commission</text>
        <g fill="#55B931">
          <rect x="38" y="164" width="12" height="12" rx="3" opacity="0.4"/>
          <rect x="56" y="160" width="12" height="16" rx="3" opacity="0.55"/>
          <rect x="74" y="156" width="12" height="20" rx="3" opacity="0.7"/>
          <rect x="92" y="152" width="12" height="24" rx="3" opacity="0.85"/>
          <rect x="110" y="148" width="12" height="28" rx="3"/>
        </g>
        <g transform="translate(24 200)">
          <rect width="82" height="54" rx="14" fill="#fff" stroke="#E6E8E3"/>
          <text x="12" y="24" font-size="18" font-weight="800" fill="#1F2A1C">3</text>
          <text x="12" y="40" font-size="9" fill="#6B7466">New orders</text>
          <rect x="90" width="82" height="54" rx="14" fill="#fff" stroke="#E6E8E3"/>
          <text x="102" y="24" font-size="18" font-weight="800" fill="#1F2A1C">5</text>
          <text x="102" y="40" font-size="9" fill="#6B7466">Live listings</text>
        </g>
        <g transform="translate(24 266)">
          <rect width="172" height="84" rx="16" fill="#DCFCE7"/>
          <text x="14" y="24" font-size="10" font-weight="700" fill="#1F2A1C">Confirm pickup</text>
          <text x="14" y="38" font-size="8.5" fill="#408B25">Match the buyer's code</text>
          <g fill="#fff">
            <rect x="14" y="48" width="30" height="26" rx="8"/>
            <rect x="50" y="48" width="30" height="26" rx="8"/>
            <rect x="86" y="48" width="30" height="26" rx="8"/>
            <rect x="122" y="48" width="30" height="26" rx="8"/>
          </g>
          <g font-size="15" font-weight="800" fill="#1F2A1C" text-anchor="middle">
            <text x="29" y="67">4</text><text x="65" y="67">8</text><text x="101" y="67">2</text><text x="137" y="67">9</text>
          </g>
        </g>
        <rect x="24" y="364" width="172" height="34" rx="17" fill="#55B931"/>
        <text x="110" y="385" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">+ Post food</text>
      </g>
      <rect x="82" y="16" width="56" height="14" rx="7" fill="#0C120A"/>
    </g>
  </g>

  <!-- Centre phone: Product (front) -->
  <g transform="translate(770 96)">
    <g class="float-b">
      <g filter="url(#shadow)">
        <rect width="240" height="480" rx="40" fill="#0C120A"/>
      </g>
      <rect x="4" y="4" width="232" height="472" rx="36" fill="#2A3326"/>
      <g clip-path="url(#clip-screen-c)">
        <rect x="10" y="10" width="220" height="460" fill="#F6F7F4"/>
        <g transform="translate(10 10)">
          <g clip-path="url(#clip-img)">
            <rect width="220" height="190" fill="url(#hero-img)"/>
            <circle cx="170" cy="30" r="90" fill="#fff" opacity="0.12"/>
            <ellipse cx="110" cy="124" rx="78" ry="20" fill="#1F2A1C" opacity="0.18"/>
            <path d="M40 98h140c0 34-31 52-70 52s-70-18-70-52Z" fill="#fff"/>
            <path d="M52 98c4-26 22-40 40-38 8-14 32-14 40 0 18-4 34 12 38 38Z" fill="#8AD86C"/>
            <circle cx="88" cy="84" r="9" fill="#FDE047"/>
            <circle cx="132" cy="80" r="8" fill="#FFEDD5"/>
            <circle cx="112" cy="92" r="6" fill="#E8A04C"/>
          </g>
          <rect x="14" y="14" width="52" height="24" rx="12" fill="#fff"/>
          <text x="40" y="30.5" text-anchor="middle" font-size="11" font-weight="800" fill="#1F2A1C">Halal</text>
          <rect x="146" y="14" width="60" height="24" rx="12" fill="#DC2626"/>
          <text x="176" y="30.5" text-anchor="middle" font-size="11" font-weight="800" fill="#fff">−60%</text>
        </g>
        <text x="26" y="232" font-size="17" font-weight="800" fill="#1F2A1C" letter-spacing="-0.3">Gado-gado</text>
        <text x="26" y="250" font-size="10" fill="#6B7466">Warung Bu Sari · 600 m</text>
        <text x="26" y="278" font-size="20" font-weight="800" fill="#408B25">Rp8.000</text>
        <text x="106" y="278" font-size="11" fill="#A3A3A3" text-decoration="line-through">Rp20.000</text>
        <rect x="26" y="292" width="188" height="44" rx="12" fill="#DCFCE7"/>
        <circle cx="46" cy="314" r="9" fill="#16A34A"/>
        <path d="M41.5 314l3.2 3.2 6-6.4" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <text x="62" y="311" font-size="10" font-weight="700" fill="#1F2A1C">Safe to eat until 20:30</text>
        <text x="62" y="325" font-size="8.5" fill="#408B25">Cooked 14:00 · eat within 6 hours</text>
        <g font-size="9" fill="#6B7466">
          <rect x="26" y="348" width="62" height="20" rx="10" fill="#fff" stroke="#E6E8E3"/>
          <text x="57" y="361.5" text-anchor="middle">Peanut</text>
          <rect x="94" y="348" width="62" height="20" rx="10" fill="#fff" stroke="#E6E8E3"/>
          <text x="125" y="361.5" text-anchor="middle">3 left</text>
        </g>
        <rect x="26" y="392" width="188" height="48" rx="24" fill="#55B931"/>
        <text x="120" y="421" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">Order for pickup</text>
      </g>
      <rect x="92" y="18" width="56" height="14" rx="7" fill="#0C120A"/>
    </g>
  </g>

  <!-- Floating chips -->
  <g transform="translate(584 574)">
    <g class="float-chip" filter="url(#soft)">
      <rect width="196" height="56" rx="18" fill="#fff"/>
      <circle cx="30" cy="28" r="14" fill="#DCFCE7"/>
      <path d="M23.5 28l4.5 4.5 8-8.5" stroke="#16A34A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <text x="54" y="25" font-size="12" font-weight="800" fill="#1F2A1C">Order confirmed</text>
      <text x="54" y="41" font-size="10" fill="#6B7466">Pickup code ready</text>
    </g>
  </g>
  <g transform="translate(566 70)">
    <g class="float-a" filter="url(#soft)">
      <rect width="150" height="56" rx="18" fill="#fff"/>
      <text x="18" y="25" font-size="10" fill="#6B7466">You rescued</text>
      <text x="18" y="44" font-size="15" font-weight="800" fill="#408B25">2.4 kg of food</text>
    </g>
  </g>
</svg>
